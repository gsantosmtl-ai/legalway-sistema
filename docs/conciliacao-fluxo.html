<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Way Group — Conciliação de Fluxo</title>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16204F">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#16204F; --navy-dark:#0E1638; --paper:#F7F5F0; --paper-dim:#FBFAF7; --ink:#1B1B1F;
    --ink-soft:#6B6B75; --line:#E4E1DA; --green:#2E7D4F; --green-bg:#EAF3ED;
    --red:#A5402E; --red-bg:#FBE9E5; --amber:#B7791F; --amber-bg:#FFF3DF; --blue-bg:#EEF0F8; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'IBM Plex Sans',sans-serif; background:var(--paper); color:var(--ink); }
  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:250px; flex-shrink:0; background:var(--navy-dark); color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .side-logo{ display:flex; align-items:center; gap:10px; padding:20px 20px 16px; }
  .side-logo img{ width:30px; height:30px; border-radius:7px; }
  .side-logo .lw{ font-family:'Fraunces',serif; font-size:14px; letter-spacing:.06em; line-height:1.1; }
  .side-logo small{ display:block; font-size:8.5px; letter-spacing:.22em; opacity:.6; }
  .side-nav{ flex:1; padding:6px 12px; overflow-y:auto; }
  .side-link{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; margin-bottom:2px;
    color:rgba(255,255,255,.68); text-decoration:none; font-size:13px; }
  .side-link:hover{ background:rgba(255,255,255,.07); color:#fff; }
  .side-link.active{ background:var(--navy); color:#fff; }
  .main{ flex:1; min-width:0; }
  .topbar2{ background:#fff; border-bottom:1px solid var(--line); padding:12px 28px; display:flex;
    align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; z-index:20; flex-wrap:wrap; }
  .content2{ padding:22px 28px 60px; }

  h1{ font-family:'Fraunces',serif; font-size:23px; }
  p.sub{ font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.6; max-width:76ch; }
  button{ font-family:inherit; font-size:13px; padding:9px 16px; border:none; border-radius:8px;
    background:var(--navy); color:#fff; cursor:pointer; min-height:40px; }
  button.leve{ background:#fff; color:var(--navy); border:1px solid var(--line); }
  button:disabled{ opacity:.55; cursor:default; }

  .placar{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin:18px 0 6px; }
  .kpi{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; }
  .kpi .n{ font-family:'Fraunces',serif; font-size:27px; line-height:1; font-variant-numeric:tabular-nums; }
  .kpi .r{ font-size:11.5px; color:var(--ink-soft); margin-top:5px; display:block; line-height:1.35; }
  .kpi.bom .n{ color:var(--green); } .kpi.mau .n{ color:var(--red); } .kpi.meio .n{ color:var(--amber); }
  .kpi.clicavel{ cursor:pointer; } .kpi.clicavel:hover{ border-color:var(--navy); }
  .kpi.ligado{ border-color:var(--navy); box-shadow:0 0 0 2px var(--blue-bg); }

  .barra-filtros{ display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin:16px 0 10px; }
  .barra-filtros input, .barra-filtros select{ font-family:inherit; font-size:13px; padding:8px 11px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); min-height:40px; }
  .barra-filtros input{ flex:1; min-width:180px; max-width:360px; }

  .lista{ display:flex; flex-direction:column; gap:8px; }
  .linha{ background:#fff; border:1px solid var(--line); border-left-width:4px; border-radius:10px; }
  .linha.ok{ border-left-color:var(--green); }
  .linha.revisao{ border-left-color:var(--ink-soft); }
  .linha.divergencia{ border-left-color:var(--amber); }
  .linha.critico{ border-left-color:var(--red); }
  .cab{ display:flex; align-items:center; gap:12px; padding:12px 15px; cursor:pointer; flex-wrap:wrap; }
  .cab .nome{ font-weight:600; font-size:14px; flex:1; min-width:150px; }
  .cab .meta{ font-size:11.5px; color:var(--ink-soft); }
  .selo{ font-size:10.5px; padding:3px 9px; border-radius:20px; white-space:nowrap; font-weight:500; }
  .selo.ok{ background:var(--green-bg); color:var(--green); }
  .selo.revisao{ background:var(--blue-bg); color:var(--navy); }
  .selo.divergencia{ background:var(--amber-bg); color:var(--amber); }
  .selo.critico{ background:var(--red-bg); color:var(--red); }
  .raiox{ border-top:1px solid var(--line); padding:4px 15px 12px; }
  .vlinha{ display:grid; grid-template-columns:22px 1fr auto; gap:10px; align-items:start;
    padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.5; }
  .vlinha:last-child{ border-bottom:none; }
  .vlinha .ico{ font-size:13px; }
  .vlinha .tit{ font-weight:600; }
  .vlinha .det{ color:var(--ink-soft); margin-top:2px; }
  .vlinha .acao{ color:var(--navy); margin-top:3px; }
  .vlinha .vals{ font-size:11.5px; color:var(--ink-soft); text-align:right; white-space:nowrap;
    font-variant-numeric:tabular-nums; }
  .vlinha .vals b{ color:var(--ink); }
  .vazio{ padding:28px; text-align:center; color:var(--ink-soft); font-size:13px;
    background:#fff; border:1px solid var(--line); border-radius:12px; }
  details.soltos{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px 15px; margin-top:12px; }
  details.soltos summary{ cursor:pointer; font-size:13.5px; font-weight:600; }
  details.soltos table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px; }
  details.soltos th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); padding:7px 8px 7px 0; border-bottom:1px solid var(--line); }
  details.soltos td{ padding:7px 8px 7px 0; border-bottom:1px solid var(--line); }
  .rolar{ overflow-x:auto; }

  @media (max-width:820px){
    .sidebar{ display:none; }
    .topbar2{ padding:12px 16px 12px 64px; }
    .content2{ padding:16px 16px 60px; }
    .barra-filtros input{ max-width:none; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="side-logo">
      <img src="assets/logo-small.png" alt="">
      <div class="lw">LEGALWAY<small>GROUP</small></div>
    </div>
    <div class="side-nav" id="side-nav"></div>
  </div>

  <div class="main">
    <div class="topbar2">
      <div>
        <h1>Conciliação de Fluxo</h1>
        <p class="sub">Confere se a corrente está inteira em cada contrato: assinatura → cliente →
        financeiro → serviços → cards da documentação. Só aponta; quem corrige é você.</p>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <span id="gerado" style="font-size:11.5px; color:var(--ink-soft);"></span>
        <button id="btn-recalcular" class="leve">Recalcular</button>
      </div>
    </div>

    <div class="content2">
      <div class="placar" id="placar"></div>

      <div class="barra-filtros">
        <input type="text" id="busca" placeholder="Cliente, serviço ou número do contrato…">
        <select id="f-situacao">
          <option value="">Todas as situações</option>
          <option value="critico">Só falhas críticas</option>
          <option value="divergencia">Só divergências</option>
          <option value="revisao">Só aguardando revisão</option>
          <option value="ok">Só conciliados</option>
        </select>
        <select id="f-etapa"><option value="">Todas as etapas</option></select>
        <select id="f-vendedor"><option value="">Todos os vendedores</option></select>
        <select id="f-tipo">
          <option value="">Qualquer divergência</option>
          <option value="financeiro.">Financeiro</option>
          <option value="doc.">Documentação</option>
          <option value="cliente.">Cliente</option>
          <option value="cancelado.">Cancelamento</option>
          <option value="contrato.">Contrato</option>
        </select>
        <button class="leve" id="btn-limpar">Limpar filtros</button>
      </div>

      <div id="lista" class="lista"><div class="vazio">Carregando a conciliação…</div></div>
      <div id="soltos"></div>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/storage.js"></script>
<script src="assets/comum.js"></script>
<script>
const esc = (x) => LW.escaparHtml(String(x == null ? '' : x));
const ICONE = { ok:'✓', revisao:'•', divergencia:'▲', critico:'✕' };
const ROTULO = { ok:'conciliado', revisao:'aguardando revisão', divergencia:'divergência', critico:'falha crítica' };
let dados = null;
let abertos = new Set();

const moeda = (v) => 'US$ ' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });

async function carregar(recalcular){
  const alvo = document.getElementById('lista');
  alvo.innerHTML = '<div class="vazio">Conferindo contrato por contrato…</div>';
  try{
    dados = await LW.api('/conciliacao' + (recalcular ? '?recalcular=1' : ''));
  }catch(e){
    alvo.innerHTML = `<div class="vazio">Não consegui montar a conciliação: ${esc(e.message)}</div>`;
    return;
  }
  const d = new Date(dados.geradoEm);
  document.getElementById('gerado').textContent = 'conferido às ' +
    d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  preencherFiltros();
  pintarPlacar();
  pintar();
  pintarSoltos();
}

function preencherFiltros(){
  const etapas = [...new Set(dados.contratos.map(c => c.etapa).filter(Boolean))].sort();
  const vend = [...new Set(dados.contratos.map(c => c.vendedor).filter(Boolean))].sort();
  const enche = (id, lista, rotulo) => {
    const el = document.getElementById(id);
    const atual = el.value;
    el.innerHTML = `<option value="">${rotulo}</option>` + lista.map(v => `<option>${esc(v)}</option>`).join('');
    el.value = atual;
  };
  enche('f-etapa', etapas, 'Todas as etapas');
  enche('f-vendedor', vend, 'Todos os vendedores');
}

// Os três primeiros baldes são exclusivos e somam o total. Se um dia pararem
// de somar, é defeito — e aparece aqui, não escondido numa planilha.
function pintarPlacar(){
  const r = dados.resumo;
  const fecha = r.conciliados + r.comDivergencia + r.aguardandoRevisao === r.auditados;
  const cartoes = [
    { n:r.auditados, rotulo:'contratos auditados', classe:'' },
    { n:r.conciliados, rotulo:'conciliados, corrente inteira', classe:'bom' },
    { n:r.comDivergencia, rotulo:'com divergência', classe:'mau', filtro:'divergencia' },
    { n:r.falhasCriticas, rotulo:'falhas críticas', classe:'mau', filtro:'critico' },
    { n:r.aguardandoRevisao, rotulo:'aguardando sua decisão', classe:'meio', filtro:'revisao' },
    { n:r.financeiroDivergente, rotulo:'financeiro divergente', classe:'mau', tipo:'financeiro.' },
    { n:r.documentacaoPendente, rotulo:'card de serviço faltando', classe:'mau', tipo:'doc.' },
    { n:r.cardsDuplicados, rotulo:'cards duplicados', classe:'mau', tipo:'doc.' },
    { n:r.clientesInconsistentes, rotulo:'cliente inconsistente', classe:'meio', tipo:'cliente.' },
  ];
  document.getElementById('placar').innerHTML = cartoes.map((c,i) => `
    <div class="kpi ${c.classe} ${c.filtro||c.tipo ? 'clicavel' : ''}" data-kpi="${i}">
      <div class="n">${c.n}</div><span class="r">${esc(c.rotulo)}</span>
    </div>`).join('') + (fecha ? '' : `
    <div class="kpi mau"><div class="n">!</div><span class="r">os números não fecham — me avise</span></div>`);
  document.querySelectorAll('[data-kpi]').forEach(el => {
    const c = cartoes[Number(el.getAttribute('data-kpi'))];
    if(!c.filtro && !c.tipo) return;
    el.addEventListener('click', ()=>{
      document.getElementById('f-situacao').value = c.filtro || '';
      document.getElementById('f-tipo').value = c.tipo || '';
      pintar();
      document.querySelectorAll('.kpi').forEach(k => k.classList.remove('ligado'));
      el.classList.add('ligado');
    });
  });
}

function filtradas(){
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const sit = document.getElementById('f-situacao').value;
  const etapa = document.getElementById('f-etapa').value;
  const vend = document.getElementById('f-vendedor').value;
  const tipo = document.getElementById('f-tipo').value;
  return dados.contratos.filter(c => {
    if(sit && c.situacao !== sit) return false;
    if(etapa && c.etapa !== etapa) return false;
    if(vend && c.vendedor !== vend) return false;
    if(tipo && !c.verificacoes.some(v => v.situacao !== 'ok' && v.chave.startsWith(tipo))) return false;
    if(busca){
      const alvo = (c.cliente + ' ' + c.id + ' ' + c.servicos.join(' ')).toLowerCase();
      if(!alvo.includes(busca)) return false;
    }
    return true;
  });
}

function pintar(){
  const lista = filtradas();
  const alvo = document.getElementById('lista');
  if(!lista.length){ alvo.innerHTML = '<div class="vazio">Nenhum contrato nesse filtro.</div>'; return; }
  // Pior primeiro: quem abre a tela precisa ver o que dói antes do que está bem.
  const ordem = { critico:0, divergencia:1, revisao:2, ok:3 };
  lista.sort((a,b) => (ordem[a.situacao] - ordem[b.situacao]) || (b.problemas - a.problemas)
    || String(a.cliente).localeCompare(String(b.cliente)));
  alvo.innerHTML = lista.map(c => `
    <div class="linha ${c.situacao}" data-id="${esc(c.id)}">
      <div class="cab" data-abrir="${esc(c.id)}">
        <span class="selo ${c.situacao}">${ICONE[c.situacao]} ${ROTULO[c.situacao]}</span>
        <span class="nome">${esc(c.cliente)}</span>
        <span class="meta">${esc(c.servicos.join(' + ') || 'sem serviço')} · ${esc(c.etapa)} · ${moeda(c.valor)}</span>
        <span class="meta">${c.problemas ? c.problemas + ' ponto(s) a ver' : 'tudo certo'}</span>
      </div>
      ${abertos.has(c.id) ? raiox(c) : ''}
    </div>`).join('');
  alvo.querySelectorAll('[data-abrir]').forEach(el => el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-abrir');
    abertos.has(id) ? abertos.delete(id) : abertos.add(id);
    pintar();
  }));
}

// O raio-X do contrato: cada elo da corrente, o que era esperado, o que foi
// encontrado e o que fazer. Sem isso o painel vira acusação sem endereço.
function raiox(c){
  return `<div class="raiox">` + c.verificacoes.map(v => `
    <div class="vlinha">
      <span class="ico" style="color:${v.situacao==='ok'?'var(--green)':v.situacao==='critico'?'var(--red)':v.situacao==='divergencia'?'var(--amber)':'var(--ink-soft)'}">${ICONE[v.situacao]}</span>
      <div>
        <span class="tit">${esc(v.titulo)}</span>
        ${v.detalhe ? `<div class="det">${esc(v.detalhe)}</div>` : ''}
        ${v.acao && v.situacao !== 'ok' ? `<div class="acao">→ ${esc(v.acao)}</div>` : ''}
      </div>
      <div class="vals">
        ${v.esperado != null ? `esperado <b>${esc(v.esperado)}</b><br>` : ''}
        ${v.encontrado != null ? `encontrado <b>${esc(v.encontrado)}</b>` : ''}
      </div>
    </div>`).join('') + `
    <div class="vlinha" style="border-top:1px solid var(--line);">
      <span class="ico">↗</span>
      <div><a href="contratos.html?abrir=${encodeURIComponent(c.id)}" style="color:var(--navy);">Abrir o contrato</a>
        · <a href="documentos.html?busca=${encodeURIComponent(c.cliente)}" style="color:var(--navy);">ver na Documentação</a>
        · <a href="financeiro.html?busca=${encodeURIComponent(c.cliente)}" style="color:var(--navy);">ver no Financeiro</a></div>
      <div class="vals"></div>
    </div></div>`;
}

// O que não pertence a contrato nenhum. Fica fechado por padrão: é o tipo de
// lista que assusta sem precisar, e nenhuma linha aqui some sozinha.
function pintarSoltos(){
  const s = dados.soltos, r = dados.resumo;
  const blocos = [
    ['Cards sem contrato', s.fichasSemContrato, r.fichasSemContrato,
      'Processos abertos que não apontam para contrato nenhum. Em geral vieram do Trello. Os que têm anexo NÃO podem ser apagados sem olhar.',
      (x)=>`<td>${esc(x.cliente)}</td><td>${esc(x.servico)}</td><td>${x.anexos} anexo(s)</td>`,
      ['Cliente','Serviço','Arquivos']],
    ['Cards de contrato que sumiu', s.fichasDeContratoSumido, r.fichasDeContratoSumido,
      'O card aponta para um contrato que não existe mais no sistema.',
      (x)=>`<td>${esc(x.cliente)}</td><td>${esc(x.servico)}</td><td>${esc(x.contratoId)}</td>`,
      ['Cliente','Serviço','Contrato apontado']],
    ['Parcelas de contrato que sumiu', s.parcelasSemContrato, r.parcelasSemContrato,
      'Lançamento preso a um contrato que não existe mais: entra nos totais sem ter de onde vir.',
      (x)=>`<td>${esc(x.cliente)}</td><td>${esc(x.descricao)}</td><td>${moeda(x.valor)}</td>`,
      ['Cliente','Lançamento','Valor']],
    ['Lançamentos avulsos', s.parcelasAvulsas, r.parcelasAvulsas,
      'Sem contrato de origem. Pode ser legítimo — serviço cobrado à parte.',
      (x)=>`<td>${esc(x.cliente)}</td><td>${esc(x.descricao)}</td><td>${moeda(x.valor)}</td>`,
      ['Cliente','Lançamento','Valor']],
    ['Clientes repetidos', s.clientesDuplicados, r.clientesDuplicados,
      'Mesmo nome em mais de um cadastro: o histórico fica partido. Pode ser homônimo de verdade.',
      (x)=>`<td>${esc(x.nome)}</td><td>${x.quantos} cadastros</td><td></td>`,
      ['Nome','Quantos','']],
  ];
  document.getElementById('soltos').innerHTML = blocos.filter(([,, n]) => n > 0).map(([titulo, itens, n, explica, linha, cabs]) => `
    <details class="soltos">
      <summary>${esc(titulo)} — ${n}</summary>
      <p class="sub" style="margin:8px 0 0;">${esc(explica)}</p>
      <div class="rolar"><table>
        <thead><tr>${cabs.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${itens.map(x=>`<tr>${linha(x)}</tr>`).join('')}</tbody>
      </table></div>
      ${n > itens.length ? `<p class="sub" style="margin-top:8px;">Mostrando ${itens.length} de ${n}.</p>` : ''}
    </details>`).join('');
}

['busca','f-situacao','f-etapa','f-vendedor','f-tipo'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener(id === 'busca' ? 'input' : 'change', ()=>{
    document.querySelectorAll('.kpi').forEach(k => k.classList.remove('ligado'));
    pintar();
  });
});
document.getElementById('btn-limpar').addEventListener('click', ()=>{
  ['busca','f-situacao','f-etapa','f-vendedor','f-tipo'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('.kpi').forEach(k => k.classList.remove('ligado'));
  pintar();
});
document.getElementById('btn-recalcular').addEventListener('click', async (e)=>{
  e.target.disabled = true; e.target.textContent = 'Conferindo…';
  await carregar(true);
  e.target.disabled = false; e.target.textContent = 'Recalcular';
});

(async ()=>{
  if(LW.menuLateral) LW.menuLateral();
  await carregar(false);
})();
</script>
</body>
</html>
