<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Way Group — Marketing</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#16204F; --navy-light:#28205E;
    --paper:#FAFAF8; --paper-dim:#F1EFEA;
    --gold:#86285F; --gold-soft:#ECD7E4;
    --ink:#1A1A1A; --ink-soft:#6B6558; --line:#DEDAD1;
    --blue-tag:#3A5A8C; --blue-tag-bg:#E7ECF3;
    --green-tag:#2F6F4E; --green-tag-bg:#E4EFE8;
    --red:#A5402E; --red-bg:#F6E7E3;
    --amber:#9A6B12; --amber-bg:#F3E9D2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  button{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;color:var(--ink);}
  button:hover{border-color:#B7AF9C;}
  button.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  button.primary:hover{background:var(--navy-light);}
  button.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  button.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:6px 8px;}
  select,input{ font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;padding:7px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink); }

  .topbar{ padding:18px 28px 14px; border-bottom:1px solid var(--line); background:#fff; }
  .topbar-row{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
  .topbar h1{font-size:20px; color:var(--navy);}
  .topbar p{margin:3px 0 0; color:var(--ink-soft); font-size:12.5px; max-width:580px;}
  .modtabs{display:flex; gap:4px; margin-top:14px; flex-wrap:wrap;}
  .modtab{ padding:7px 13px; font-size:13px; border-radius:20px; cursor:pointer; color:var(--ink-soft); }
  .modtab.active{ background:var(--navy); color:#fff; }
  .modtab:not(.active):hover{ background:var(--paper-dim); }

  .period-bar{ margin:16px 28px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between; }
  .chip-row{ display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:3px; }
  .chip{ padding:6px 14px; font-size:12.5px; border-radius:6px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; }
  .chip.active{ background:var(--navy); color:#fff; }
  .chip:not(.active):hover{ background:var(--paper-dim); }
  .mes-nav{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 14px; }
  .mes-nav button{ border:none; background:none; font-size:15px; color:var(--navy); padding:2px 6px; cursor:pointer; border-radius:6px; }
  .mes-nav button:hover{ background:var(--paper-dim); }
  .mes-nav .mes-label{ font-family:'Fraunces',serif; font-weight:600; font-size:13.5px; color:var(--navy); min-width:130px; text-align:center; text-transform:capitalize; }

  .fonte-nota{ margin:14px 28px 0; font-size:11.5px; color:var(--ink-soft); background:#fff; border:1px solid var(--line); border-radius:8px; padding:9px 14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }

  #relatorio-area{ padding:4px 28px 60px; }
  .rel-header{ margin:16px 0 4px; }
  .rel-header h2{ font-size:17px; color:var(--navy); }
  .rel-header .periodo-label{ font-size:12px; color:var(--ink-soft); margin-top:2px; }

  .kpi-strip{ margin:14px 0 0; display:flex; gap:10px; flex-wrap:wrap; }
  .kpi-card{ flex:1; min-width:150px; background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 15px; }
  .kpi-card .lbl{ font-size:11px; color:var(--ink-soft); }
  .kpi-card .val{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:var(--navy); margin-top:3px; }
  .kpi-card.alerta .val{ color:var(--red); }
  .kpi-card.bom .val{ color:var(--green-tag); }

  .panel{ margin-top:14px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; }
  .panel h3{ font-size:14.5px; color:var(--navy); margin-bottom:14px; }

  table.rel-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .rel-table thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);
    padding:8px 10px; border-bottom:1px solid var(--line); background:var(--paper-dim); white-space:nowrap;
  }
  .rel-table thead th.num{ text-align:right; }
  .rel-table tbody td{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .rel-table tbody td.num{ text-align:right; }
  .rel-table tbody tr:last-child td{ border-bottom:none; }
  .rel-table tfoot td{ padding:9px 10px; font-weight:600; border-top:2px solid var(--line); }

  .empty{ padding:20px 4px; color:var(--ink-soft); font-size:13px; text-align:center; }

  @media print{ .topbar, .period-bar, .fonte-nota{ display:none !important; } body{ background:#fff; } }
  @media (max-width:900px){ #relatorio-area{ overflow-x:auto; } }
  @media (max-width:720px){ .topbar, .period-bar, .fonte-nota, #relatorio-area{ padding-left:16px; padding-right:16px; } }
</style>
</head>

function fmtMoney(v){ return 'US$ ' + Number(v||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtData(iso){ return iso ? iso.split('-').reverse().join('/') : '—'; }

async function loadAll(){
  try{
    const r = await window.storage.get(MKT_KEY, true);
    adsData = r && r.value ? JSON.parse(r.value) : seedAdsData();
  }catch(e){ adsData = seedAdsData(); }
  await saveAds();
  try{ const r = await window.storage.get(LEADS_KEY, true); leads = r && r.value ? JSON.parse(r.value) : []; }catch(e){ leads = []; }
  try{ const r = await window.storage.get(CONTRATOS_KEY, true); contratos = r && r.value ? JSON.parse(r.value) : []; }catch(e){ contratos = []; }

  if(adsData.length){
    const ultimaData = adsData.slice().sort((a,b)=>b.data.localeCompare(a.data))[0].data;
    mesSelecionado = ultimaData.slice(0,7);
  }
  render();
}
async function saveAds(){ try{ await window.storage.set(MKT_KEY, JSON.stringify(adsData), true); }catch(e){} }

function render(){
  document.querySelectorAll('.modtab[data-tab]').forEach(t=>t.classList.toggle('active', t.getAttribute('data-tab')===currentTab));
  document.getElementById('mes-nav').innerHTML = renderMesNavHtml();
  wireMesNav();

  const ultimaImportacao = adsData.length ? adsData.slice().sort((a,b)=>b.data.localeCompare(a.data))[0].data : null;
  document.getElementById('fonte-nota').innerHTML = `
    <span>📡 Fonte: Meta Ads via Windsor.ai. Dado mais recente importado: <b>${ultimaImportacao ? fmtData(ultimaImportacao) : '—'}</b> — isso é um retrato do momento, não atualiza sozinho.</span>
    <span style="color:var(--ink-soft);">Peça uma nova importação quando quiser dados mais atuais.</span>
  `;

  if(currentTab === 'mensal') renderMensal(); else renderDiario();
}

function renderMesNavHtml(){
  const [ano, mes] = mesSelecionado.split('-').map(Number);
  const nomeMes = new Date(ano, mes-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  return `<button id="mes-prev">‹</button><div class="mes-label">${nomeMes}</div><button id="mes-next">›</button>`;
}
function wireMesNav(){
  document.getElementById('mes-prev').addEventListener('click', ()=> mudarMes(-1));
  document.getElementById('mes-next').addEventListener('click', ()=> mudarMes(1));
}
function mudarMes(delta){
  const [ano, mes] = mesSelecionado.split('-').map(Number);
  mesSelecionado = new Date(ano, mes-1+delta, 1).toISOString().slice(0,7);
  render();
}
document.querySelectorAll('.modtab[data-tab]').forEach(t=>{
  t.addEventListener('click', ()=>{ currentTab = t.getAttribute('data-tab'); render(); });
});

function header(titulo, sub){
  return `<div class="rel-header"><h2>${titulo}</h2><div class="periodo-label">${sub}</div></div>`;
}
function tableShell(headers, bodyHtml, footHtml){
  return `<table class="rel-table"><thead><tr>${headers.map(h=>`<th class="${h.num?'num':''}">${h.label}</th>`).join('')}</tr></thead>
    <tbody>${bodyHtml}</tbody>${footHtml ? `<tfoot><tr>${footHtml}</tr></tfoot>` : ''}</table>`;
}

// ---- VISÃO MENSAL ----
function renderMensal(){
  const doMes = adsData.filter(d => d.data.slice(0,7) === mesSelecionado);
  const leadsDoMes = leads.filter(l => l.entrada && l.entrada.slice(0,7) === mesSelecionado);
  const contratosDoMes = contratos.filter(c => c.etapa==='Assinado' && c.dataAssinatura && c.dataAssinatura.slice(0,7) === mesSelecionado);

  const gastoTotal = doMes.reduce((s,d)=>s+d.gasto,0);
  const cliquesTotal = doMes.reduce((s,d)=>s+d.cliques,0);
  const cpc = cliquesTotal ? gastoTotal/cliquesTotal : 0;
  const cpl = leadsDoMes.length ? gastoTotal/leadsDoMes.length : 0;
  const cac = contratosDoMes.length ? gastoTotal/contratosDoMes.length : 0;
  const valorVendido = contratosDoMes.reduce((s,c)=>s+Number(c.valor||0),0);
  const roas = gastoTotal ? valorVendido/gastoTotal : 0;

  // agrupar por semana pra visão mensal resumida
  const porSemana = {};
  doMes.forEach(d=>{
    const dt = new Date(d.data+'T12:00:00');
    const semana = 'Semana de ' + fmtData(new Date(dt.setDate(dt.getDate() - dt.getDay())).toISOString().slice(0,10));
    if(!porSemana[semana]) porSemana[semana] = {gasto:0, cliques:0};
    porSemana[semana].gasto += d.gasto; porSemana[semana].cliques += d.cliques;
  });
  const rows = Object.entries(porSemana).map(([sem,v])=>`
    <tr><td>${sem}</td><td class="num">${fmtMoney(v.gasto)}</td><td class="num">${v.cliques}</td><td class="num">${fmtMoney(v.cliques?v.gasto/v.cliques:0)}</td></tr>
  `).join('');

  document.getElementById('relatorio-area').innerHTML = `
    ${header('Visão Mensal — Meta Ads', new Date(...mesSelecionado.split('-').map((v,i)=>i===1?v-1:v)).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}
    <div class="kpi-strip">
      <div class="kpi-card alerta"><div class="lbl">Investido no mês</div><div class="val" style="font-size:17px;">${fmtMoney(gastoTotal)}</div></div>
      <div class="kpi-card"><div class="lbl">Cliques</div><div class="val">${cliquesTotal}</div></div>
      <div class="kpi-card"><div class="lbl">CPC médio</div><div class="val" style="font-size:16px;">${fmtMoney(cpc)}</div></div>
      <div class="kpi-card bom"><div class="lbl">Leads gerados</div><div class="val">${leadsDoMes.length}</div></div>
      <div class="kpi-card"><div class="lbl">CPL (custo por lead)</div><div class="val" style="font-size:16px;">${fmtMoney(cpl)}</div></div>
      <div class="kpi-card"><div class="lbl">Contratos assinados</div><div class="val">${contratosDoMes.length}</div></div>
      <div class="kpi-card"><div class="lbl">CAC (custo por cliente)</div><div class="val" style="font-size:16px;">${fmtMoney(cac)}</div></div>
      <div class="kpi-card bom"><div class="lbl">ROAS (retorno sobre investimento)</div><div class="val">${roas.toFixed(2)}x</div></div>
    </div>
    <div class="panel">
      <h3>Gasto por semana</h3>
      ${Object.keys(porSemana).length ? tableShell(
        [{label:'Semana'},{label:'Investido',num:1},{label:'Cliques',num:1},{label:'CPC',num:1}], rows
      ) : `<div class="empty">Sem dados de anúncio nesse mês.</div>`}
    </div>
    <div class="panel" style="font-size:11.5px; color:var(--ink-soft);">
      CPL = investido ÷ leads capturados no sistema no mês. CAC = investido ÷ contratos assinados no mês. ROAS = valor vendido ÷ investido. São aproximações — leads/contratos podem vir de outras origens além do Meta Ads (indicação, Google, etc.), então o custo real por lead pago pode ser menor que o mostrado aqui.
    </div>
  `;
}

// ---- VISÃO DIÁRIA ----
function renderDiario(){
  const doMes = adsData.filter(d => d.data.slice(0,7) === mesSelecionado).sort((a,b)=>a.data.localeCompare(b.data));
  const gastoTotal = doMes.reduce((s,d)=>s+d.gasto,0);
  const cliquesTotal = doMes.reduce((s,d)=>s+d.cliques,0);
  const leadsPorDia = {};
  leads.forEach(l=>{ if(l.entrada){ const d=l.entrada.slice(0,10); leadsPorDia[d]=(leadsPorDia[d]||0)+1; } });

  const rows = doMes.map(d=>{
    const leadsNoDia = leadsPorDia[d.data] || 0;
    const cplDia = leadsNoDia ? d.gasto/leadsNoDia : null;
    return `<tr><td>${fmtData(d.data)}</td><td>${d.conta}</td><td class="num">${fmtMoney(d.gasto)}</td><td class="num">${d.cliques}</td>
      <td class="num">${fmtMoney(d.cliques?d.gasto/d.cliques:0)}</td><td class="num">${leadsNoDia}</td><td class="num">${cplDia!==null?fmtMoney(cplDia):'—'}</td></tr>`;
  }).join('');

  document.getElementById('relatorio-area').innerHTML = `
    ${header('Visão Diária — Meta Ads', new Date(...mesSelecionado.split('-').map((v,i)=>i===1?v-1:v)).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}
    <div class="kpi-strip">
      <div class="kpi-card alerta"><div class="lbl">Investido no mês</div><div class="val" style="font-size:17px;">${fmtMoney(gastoTotal)}</div></div>
      <div class="kpi-card"><div class="lbl">Cliques no mês</div><div class="val">${cliquesTotal}</div></div>
      <div class="kpi-card"><div class="lbl">Dias com veiculação</div><div class="val">${doMes.length}</div></div>
    </div>
    <div class="panel">
      ${doMes.length ? tableShell(
        [{label:'Data'},{label:'Conta'},{label:'Investido',num:1},{label:'Cliques',num:1},{label:'CPC',num:1},{label:'Leads no dia',num:1},{label:'CPL do dia',num:1}],
        rows,
        `<td colspan="2">Total do mês</td><td class="num">${fmtMoney(gastoTotal)}</td><td class="num">${cliquesTotal}</td><td colspan="3"></td>`
      ) : `<div class="empty">Sem dados de anúncio nesse mês.</div>`}
    </div>
  `;
}

// ---- Exportar PDF ----
document.getElementById('btn-baixar-pdf').addEventListener('click', async ()=>{
  const btn = document.getElementById('btn-baixar-pdf');
  btn.disabled = true; btn.textContent = 'Gerando...';
  const nomeAba = document.querySelector('.modtab.active').textContent.trim();
  const fileName = `LegalWay_Marketing_${nomeAba.replace(/\s+/g,'_')}_${mesSelecionado}.pdf`;
  const el = document.getElementById('relatorio-area');
  try{
    await html2pdf().set({
      margin:[10,10,10,10], filename:fileName,
      image:{type:'jpeg',quality:0.95},
      html2canvas:{ scale:1.5, useCORS:true, backgroundColor:'#ffffff' },
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
      pagebreak:{mode:['css','legacy']}
    }).from(el).save();
  }catch(e){ console.error(e); }
  btn.disabled = false; btn.textContent = '⬇ Baixar PDF';
});

window.addEventListener('focus', loadAll);
setInterval(loadAll, 60000);

loadAll();
</script>
