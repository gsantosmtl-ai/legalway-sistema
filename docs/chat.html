<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Way Group — Chat Interno</title>
<link rel="icon" href="assets/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16204F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/assets/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16204F; --navy-light:#28205E; --navy-dark:#0E1638;
    --paper:#FAFAF8; --paper-dim:#F1EFEA;
    --gold:#86285F; --gold-soft:#ECD7E4;
    --ink:#1A1A1A; --ink-soft:#6B6558; --line:#DEDAD1;
    --blue-tag:#3A5A8C; --blue-tag-bg:#E7ECF3;
    --green-tag:#2F6F4E; --green-tag-bg:#E4EFE8;
    --red:#A5402E; --red-bg:#F6E7E3;
    --amber:#9A6B12; --amber-bg:#F3E9D2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  button{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:8px 14px;color:var(--ink);}
  button.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
  input{ font-family:'IBM Plex Sans',sans-serif; font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); width:100%; }

  .app{ display:flex; min-height:100vh; }
  .sidebar{ width:250px; flex-shrink:0; background:var(--navy-dark); color:#fff; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .side-logo{ display:flex; align-items:center; gap:10px; padding:20px 20px 16px; }
  .side-logo img{ width:34px; height:34px; border-radius:50%; }
  .side-logo .lw{ font-family:'Fraunces',serif; font-weight:700; font-size:15px; line-height:1.15; }
  .side-logo .lw small{ display:block; font-size:8.5px; letter-spacing:.28em; color:rgba(255,255,255,.5); font-weight:500; font-family:'IBM Plex Sans',sans-serif; }
  .side-nav{ flex:1; padding:6px 12px; }
  .side-link{ display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; margin-bottom:2px; color:rgba(255,255,255,.68); text-decoration:none; font-size:13.3px; font-weight:500; }
  .side-link span:not(.badge){ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-link:hover{ background:rgba(255,255,255,.06); color:#fff; }
  .side-link.active{ background:var(--gold); color:#fff; }
  .side-link svg{ flex-shrink:0; opacity:.9; }
  .side-link.disabled{ opacity:.38; cursor:default; pointer-events:none; }
  .side-soon{ font-size:8.5px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-left:auto; }

  .main{ flex:1; min-width:0; display:flex; }

  .chat-list{ width:280px; flex-shrink:0; background:#fff; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  .chat-list-head{ padding:18px 18px 10px; }
  .chat-list-head h1{ font-size:19px; color:var(--navy); }
  .chat-search{ padding:0 14px 10px; }
  .chat-section-lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:10px 16px 4px; font-weight:600; }
  .chat-item{ display:flex; align-items:center; gap:10px; padding:9px 14px; cursor:pointer; position:relative; }
  .chat-item:hover{ background:var(--paper-dim); }
  .chat-item.active{ background:var(--gold-soft); }
  .chat-avatar{ width:34px; height:34px; border-radius:50%; background:var(--blue-tag-bg); color:var(--blue-tag); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:12px; flex-shrink:0; position:relative; }
  .chat-avatar.canal{ background:var(--gold-soft); color:var(--gold); border-radius:9px; font-size:14px; }
  .status-dot{ position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%; border:2px solid #fff; }
  .status-dot.online{ background:var(--green-tag); }
  .status-dot.offline{ background:#B7AF9C; }
  .chat-item-info{ flex:1; min-width:0; }
  .chat-item-nome{ font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-item-sub{ font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .unread-badge{ background:var(--red); color:#fff; font-size:10px; font-weight:700; border-radius:10px; min-width:18px; height:18px; display:flex; align-items:center; justify-content:center; padding:0 5px; }

  .chat-area{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-area-head{ padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  .chat-area-head h3{ font-size:15px; color:var(--navy); }
  .chat-area-head .sub{ font-size:11.5px; color:var(--ink-soft); }
  .chat-messages{ flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:60%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.4; }
  .msg.mine{ align-self:flex-end; background:var(--navy); color:#fff; border-bottom-right-radius:3px; }
  .msg.other{ align-self:flex-start; background:var(--paper-dim); color:var(--ink); border-bottom-left-radius:3px; }
  .msg .autor{ font-size:10.5px; font-weight:700; margin-bottom:3px; opacity:.75; }
  .msg .hora{ font-size:9.5px; opacity:.6; margin-top:4px; text-align:right; }
  .chat-input-row{ padding:14px 22px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn-anexo{ background:none; border:1px solid var(--line); border-radius:9px; width:40px; height:38px; cursor:pointer; font-size:17px; }
  .btn-anexo:hover{ background:var(--paper-dim, #f1efe9); }
  .anexo-chip{ width:100%; font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; }
  .anexo-chip button{ border:none; background:none; cursor:pointer; color:var(--ink-soft); font-size:14px; }
  .msg img.anexo-img{ max-width:260px; max-height:220px; border-radius:8px; display:block; margin-top:4px; cursor:zoom-in; }
  .msg a.anexo-link{ display:inline-flex; align-items:center; gap:6px; margin-top:4px; padding:6px 10px; border-radius:8px; background:rgba(0,0,0,.06); color:inherit; text-decoration:none; font-size:12.5px; }
  .msg.mine a.anexo-link{ background:rgba(255,255,255,.15); }
  .empty-chat{ margin:auto; text-align:center; color:var(--ink-soft); font-size:13px; }

  @media (max-width:900px){ .sidebar{ display:none; } .chat-list{ width:220px; } }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="side-logo">
      <img src="assets/logo-small.png" alt="">
      <div class="lw">LEGALWAY<small>GROUP</small></div>
    </div>
    <div class="side-nav" id="side-nav"></div>
  </div>

  <div class="chat-list">
    <div class="chat-list-head"><h1>💬 Chat</h1></div>
    <div class="chat-section-lbl">Canais</div>
    <div id="lista-canais"></div>
    <div class="chat-section-lbl">Direto</div>
    <div id="lista-diretos"></div>
  </div>

  <div class="chat-area">
    <div class="chat-area-head" id="chat-area-head"></div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row" id="chat-input-row" style="display:none;">
      <div class="anexo-chip" id="anexo-chip" style="display:none;"></div>
      <button class="btn-anexo" id="chat-anexar" title="Anexar imagem, PDF ou documento">📎</button>
      <input type="file" id="chat-arquivo" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.zip" style="display:none;">
      <input type="text" id="chat-input" placeholder="Escreva uma mensagem..." style="flex:1;">
      <button class="gold" id="chat-enviar">Enviar</button>
    </div>
  </div>
</div>

<script src="assets/api.js"></script>
<script src="assets/comum.js"></script>
<script src="assets/i18n-dicionario.js"></script>
<script src="assets/i18n.js"></script>
<script>
// Fase 2: mensagens, presença e "não lidas" vivem no servidor (Postgres).
// Entrega instantânea por WebSocket; se a conexão cair, reconecta sozinha e, enquanto isso, atualiza a cada 30s.
const CANAIS_INFO = {
  vendas:{nome:'vendas', icone:'💼'},
  documentacao:{nome:'documentação', icone:'📁'},
  financeiro:{nome:'financeiro', icone:'💰'}
};
const esc = LW.escaparHtml;

function tocarBip(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 780;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start(); osc.stop(ctx.currentTime + 0.25);
  }catch(e){}
}

let sessao = null;
let canais = [];
let equipe = [];          // [{id, nome}] — só ativos
let mensagens = [];       // tudo que essa pessoa pode ver, em ordem de id
let online = new Set();   // ids online agora
let lidas = {};           // conversa -> ISO da última leitura
let conversaAtiva = null; // {tipo:'canal', key:'vendas'} ou {tipo:'direta', comId:'u2', com:'Renato'}
let piscaInterval = null;
let conectado = false;
const tituloOriginal = document.title;

const maiorId = ()=> mensagens.length ? mensagens[mensagens.length-1].id : 0;
const nomeDe = (id)=> (equipe.find(u=>u.id===id) || {}).nome || id;

async function loadAll(){
  try{ sessao = await LW.sessao(); }catch(e){ return; } // sem sessão válida, api.js já mandou pro login
  await carregarEstado();
  const r = await LW.api('/chat/mensagens');
  mensagens = r.mensagens;
  renderSidebar();
  renderListas();

  LW.tempoReal(receberEvento, (ok)=>{ conectado = ok; renderListas(); if(conversaAtiva) renderConversa(); });
  setInterval(sincronizar, 30000); // rede de segurança caso o tempo real esteja fora
}

async function carregarEstado(){
  const e = await LW.api('/chat/estado');
  canais = e.canais; equipe = e.equipe; lidas = e.lidas; online = new Set(e.online);
}

// Busca só o que chegou depois da última mensagem conhecida
async function sincronizar(){
  try{
    const r = await LW.api('/chat/mensagens?apos=' + maiorId());
    if(r.mensagens.length){ r.mensagens.forEach(adicionarMensagem); renderListas(); if(conversaAtiva) renderConversa(); }
    await carregarEstado(); renderListas();
  }catch(e){}
}

function receberEvento(ev){
  if(ev.tipo === 'presenca'){ online = new Set(ev.online); renderListas(); if(conversaAtiva) renderConversa(); }
  if(ev.tipo === 'mensagem'){
    const nova = adicionarMensagem(ev.mensagem);
    if(nova && ev.mensagem.deId !== sessao.usuarioId){ tocarBip(); piscarTitulo(); }
    if(conversaAtiva) renderConversa(); // primeiro a conversa (marca como lida), depois as listas (badges)
    renderListas();
  }
}

function adicionarMensagem(m){
  if(mensagens.some(x=>x.id===m.id)) return false;
  mensagens.push(m);
  mensagens.sort((a,b)=>a.id-b.id);
  return true;
}

function piscarTitulo(){
  if(piscaInterval || document.hasFocus()) return;
  let mostrandoAviso = false;
  piscaInterval = setInterval(()=>{
    document.title = mostrandoAviso ? tituloOriginal : '💬 Nova mensagem!';
    mostrandoAviso = !mostrandoAviso;
  }, 1000);
  window.addEventListener('focus', pararDePiscar, {once:true});
}
function pararDePiscar(){
  if(piscaInterval){ clearInterval(piscaInterval); piscaInterval = null; document.title = tituloOriginal; }
}

function estaOnline(id){ return online.has(id); }

function convKey(conv){
  if(conv.tipo === 'canal') return 'canal:' + conv.key;
  return 'dm:' + [sessao.usuarioId, conv.comId].sort().join('|');
}
function mensagensDaConversa(conv){
  if(conv.tipo === 'canal') return mensagens.filter(m=>m.tipo==='canal' && m.canal===conv.key);
  return mensagens.filter(m=>m.tipo==='direta' && ((m.deId===sessao.usuarioId && m.paraId===conv.comId) || (m.deId===conv.comId && m.paraId===sessao.usuarioId)));
}
function naoLidas(conv){
  const ultimaLeitura = lidas[convKey(conv)] || null;
  return mensagensDaConversa(conv).filter(m => m.deId !== sessao.usuarioId && (!ultimaLeitura || m.quando > ultimaLeitura)).length;
}
async function marcarComoLida(conv){
  if(naoLidas(conv) === 0) return; // nada novo: não incomoda o servidor
  const key = convKey(conv);
  lidas[key] = new Date().toISOString();
  renderListas();
  try{ const r = await LW.api('/chat/lida', { method:'POST', body:{ conversa:key } }); lidas[key] = r.lidaAte; }catch(e){}
}

// ===== Sidebar (mínima, só navegação de volta) =====
function renderSidebar(){
  const items = [
    {label:'Dashboard', href:'index.html'},
    {label:'Tarefas', href:'tarefas.html'},
    {label:'Documentação', href:'documentos.html'},
    {label:'Contratos', href:'contratos.html'},
    {label:'Financeiro', href:'financeiro.html'},
  ];
  document.getElementById('side-nav').innerHTML = items.map(it=>
    `<a class="side-link" href="${it.href}"><span>${it.label}</span></a>`
  ).join('') + `<div style="margin-top:20px; padding:0 12px;"><div style="font-size:10px; color:rgba(255,255,255,.4); line-height:1.6;">Logado como<br><b style="color:#fff;">${esc(sessao.nome)}</b></div></div>`;
}

// ===== Listas =====
function renderListas(){
  document.getElementById('lista-canais').innerHTML = canais.map(cn=>{
    const key = typeof cn === 'string' ? cn : cn.key;
    const c = typeof cn === 'string' ? (CANAIS_INFO[cn] || {nome:cn, icone:'#'}) : {nome:cn.nome||cn.key, icone:cn.icone||'#'};
    const conv = {tipo:'canal', key};
    const nl = naoLidas(conv);
    const ativo = conversaAtiva && conversaAtiva.tipo==='canal' && conversaAtiva.key===key;
    return `<div class="chat-item ${ativo?'active':''}" data-canal="${key}">
      <div class="chat-avatar canal">${c.icone}</div>
      <div class="chat-item-info"><div class="chat-item-nome">#${c.nome}</div></div>
      ${nl>0 ? `<div class="unread-badge">${nl}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('lista-diretos').innerHTML = equipe.filter(u=>u.id!==sessao.usuarioId).map(u=>{
    const conv = {tipo:'direta', comId:u.id, com:u.nome};
    const nl = naoLidas(conv);
    const on = estaOnline(u.id);
    const ativo = conversaAtiva && conversaAtiva.tipo==='direta' && conversaAtiva.comId===u.id;
    return `<div class="chat-item ${ativo?'active':''}" data-direto="${u.id}">
      <div class="chat-avatar">${u.sistema ? '🤖' : esc(u.nome.slice(0,2).toUpperCase())}${u.sistema ? '' : `<span class="status-dot ${on?'online':'offline'}"></span>`}</div>
      <div class="chat-item-info"><div class="chat-item-nome">${esc(u.nome)}</div><div class="chat-item-sub">${u.sistema ? 'Avisos automáticos' : (on?'Online':'Offline')}</div></div>
      ${nl>0 ? `<div class="unread-badge">${nl}</div>` : ''}
    </div>`;
  }).join('') + (conectado ? '' : `<div style="padding:8px 12px; font-size:11px; color:var(--ink-soft);">⚠️ Reconectando ao servidor…</div>`);
  document.querySelectorAll('[data-canal]').forEach(el=>{
    el.addEventListener('click', ()=> abrirConversa({tipo:'canal', key:el.getAttribute('data-canal')}));
  });
  document.querySelectorAll('[data-direto]').forEach(el=>{
    const id = el.getAttribute('data-direto');
    el.addEventListener('click', ()=> abrirConversa({tipo:'direta', comId:id, com:nomeDe(id)}));
  });
}

function abrirConversa(conv){
  conversaAtiva = conv;
  marcarComoLida(conv);
  renderListas();
  renderConversa();
  document.getElementById('chat-input-row').style.display = (conv.tipo==='direta' && conv.comId==='sistema') ? 'none' : 'flex';
  document.getElementById('chat-input').focus();
}

function renderConversa(){
  const head = document.getElementById('chat-area-head');
  const infoCanal = (k)=>{ const cn = canais.find(x => (typeof x === 'string' ? x : x.key) === k); return cn && typeof cn !== 'string' ? cn : (CANAIS_INFO[k] || {nome:k}); };
  const nomeConv = conversaAtiva.tipo==='canal' ? `#${esc(infoCanal(conversaAtiva.key).nome)}` : esc(conversaAtiva.com);
  const subConv = conversaAtiva.tipo==='canal' ? 'Canal da equipe' : (conversaAtiva.comId==='sistema' ? 'Avisos automáticos do sistema' : (estaOnline(conversaAtiva.comId) ? 'Online' : 'Offline'));
  head.innerHTML = `<div><h3>${nomeConv}</h3><div class="sub">${subConv}</div></div>`;
  const lista = mensagensDaConversa(conversaAtiva);
  const box = document.getElementById('chat-messages');
  const pertoDoFim = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  box.innerHTML = lista.length ? lista.map(m=>{
    const minha = m.deId === sessao.usuarioId;
    let anexo = '';
    if(m.arquivo && m.arquivo.url){
      const ehImagem = /^image\//.test(m.arquivo.tipo || '');
      anexo = ehImagem
        ? `<a href="${esc(m.arquivo.url)}" target="_blank" rel="noopener"><img class="anexo-img" src="${esc(m.arquivo.url)}" alt="${esc(m.arquivo.nome)}"></a>`
        : `<a class="anexo-link" href="${esc(m.arquivo.url)}" target="_blank" rel="noopener">📄 ${esc(m.arquivo.nome)}</a>`;
    }
    return `<div class="msg ${minha?'mine':'other'}">
      ${!minha && conversaAtiva.tipo==='canal' ? `<div class="autor">${esc(m.de)}</div>` : ''}
      ${esc(m.texto)}${anexo}
      <div class="hora">${new Date(m.quando).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</div>
    </div>`;
  }).join('') : `<div class="empty-chat">Nenhuma mensagem ainda — diz oi! 👋</div>`;
  if(pertoDoFim) box.scrollTop = box.scrollHeight;
  marcarComoLida(conversaAtiva);
}

document.getElementById('chat-enviar').addEventListener('click', enviarMensagem);
document.getElementById('chat-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') enviarMensagem(); });

// ===== Anexos =====
let anexoPendente = null; // {nome, conteudo}
document.getElementById('chat-anexar').addEventListener('click', ()=> document.getElementById('chat-arquivo').click());
document.getElementById('chat-arquivo').addEventListener('change', (e)=>{
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  if(f.size > 25*1024*1024){ alert('Arquivo maior que 25 MB.'); return; }
  const r = new FileReader();
  r.onload = ()=>{ anexoPendente = { nome:f.name, conteudo:r.result }; mostrarChipAnexo(); document.getElementById('chat-input').focus(); };
  r.readAsDataURL(f);
});
function mostrarChipAnexo(){
  const chip = document.getElementById('anexo-chip');
  if(!anexoPendente){ chip.style.display = 'none'; chip.innerHTML = ''; return; }
  chip.style.display = 'flex';
  chip.innerHTML = `📎 <span>${esc(anexoPendente.nome)}</span> <button type="button" id="anexo-remover" title="Remover">✕</button>`;
  document.getElementById('anexo-remover').addEventListener('click', ()=>{ anexoPendente = null; mostrarChipAnexo(); });
}

let enviando = false;
async function enviarMensagem(){
  const input = document.getElementById('chat-input');
  const texto = input.value.trim();
  if((!texto && !anexoPendente) || !conversaAtiva || enviando) return;
  enviando = true;
  const btn = document.getElementById('chat-enviar');
  if(anexoPendente){ btn.disabled = true; btn.textContent = 'Enviando…'; }
  try{
    const body = conversaAtiva.tipo === 'canal'
      ? { tipo:'canal', canal: conversaAtiva.key, texto }
      : { tipo:'direta', paraId: conversaAtiva.comId, texto };
    if(anexoPendente) body.arquivo = anexoPendente;
    const r = await LW.api('/chat/mensagens', { method:'POST', body });
    adicionarMensagem(r.mensagem); // o WebSocket também entrega; adicionarMensagem ignora duplicada
    input.value = ''; anexoPendente = null; mostrarChipAnexo();
    renderConversa();
    renderListas();
  }catch(e){
    alert('Não foi possível enviar: ' + e.message);
  }finally{ enviando = false; btn.disabled = false; btn.textContent = 'Enviar'; }
}

loadAll();
</script>
</body>
</html>
