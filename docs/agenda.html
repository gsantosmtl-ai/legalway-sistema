<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal Way Group — Agenda</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16204F; --navy-light:#28205E;
    --paper:#FAFAF8; --paper-dim:#F1EFEA;
    --gold:#86285F; --gold-soft:#ECD7E4;
    --ink:#1A1A1A; --ink-soft:#6B6558; --line:#DEDAD1;
    --blue-tag:#3A5A8C; --blue-tag-bg:#E7ECF3;
    --green-tag:#2F6F4E; --green-tag-bg:#E4EFE8;
    --red:#A5402E; --red-bg:#F6E7E3;
    --amber:#9A6B12; --amber-bg:#F3E9D2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'IBM Plex Sans',sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  button{font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;color:var(--ink);}
  button:hover{border-color:#B7AF9C;}
  button.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  button.primary:hover{background:var(--navy-light);}
  button.ghost{background:transparent;border-color:transparent;color:var(--ink-soft);padding:6px 8px;}
  button.ghost:hover{color:var(--ink);text-decoration:underline;}
  button.danger{color:var(--red);}
  button.icon{ padding:6px 10px; }
  select,input,textarea{
    font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;padding:7px 10px;border-radius:6px;
    border:1px solid var(--line);background:#fff;color:var(--ink);
  }

  .topbar{ padding:20px 28px 14px; border-bottom:1px solid var(--line); background:#fff; }
  .topbar-row{display:flex; gap:12px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap;}
  .topbar h1{font-size:21px; color:var(--navy);}
  .topbar p{margin:3px 0 0; color:var(--ink-soft); font-size:13px;}
  .tabs{display:flex; gap:4px; margin-top:14px; flex-wrap:wrap;}
  .tab{ padding:7px 13px; font-size:13px; border-radius:20px; cursor:pointer; color:var(--ink-soft); }
  .tab.active{ background:var(--navy); color:#fff; }
  .tab:not(.active):hover{ background:var(--paper-dim); }

  .controls-row{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    padding:14px 28px 0;
  }
  .date-nav{ display:flex; align-items:center; gap:8px; }
  .date-nav .current-date{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; min-width:190px; text-align:center; }
  .view-toggle{ display:flex; gap:4px; }
  .view-toggle .tab{ padding:6px 11px; font-size:12.5px; }

  .cal-wrap{
    margin:16px 28px 60px; border:1px solid var(--line); border-radius:10px; background:#fff;
    max-width:640px; overflow:hidden;
  }
  .cal-hour-row{ display:flex; min-height:52px; border-top:1px solid var(--line); position:relative; }
  .cal-hour-row:first-child{ border-top:none; }
  .cal-hour-label{ width:56px; flex-shrink:0; font-size:11px; color:var(--ink-soft); padding:4px 8px; text-align:right; box-sizing:border-box; }
  .cal-hour-track{ flex:1; position:relative; padding:2px 8px; }

  .cal-event{
    background:var(--blue-tag-bg); color:var(--blue-tag); border-left:3px solid var(--blue-tag);
    border-radius:6px; font-size:12px; padding:4px 8px; margin-bottom:3px; cursor:pointer;
  }
  .cal-event:hover{ filter:brightness(0.96); }
  .cal-event .ev-time{ font-weight:600; }
  .cal-event.status-realizada{ opacity:.55; }
  .cal-event.status-cancelada{ opacity:.45; text-decoration:line-through; }
  .cal-event.vendedor-adriano{ background:var(--green-tag-bg); color:var(--green-tag); border-left-color:var(--green-tag); }

  .list-view{ margin:16px 28px 60px; max-width:640px; display:flex; flex-direction:column; gap:18px; }
  .list-day{ display:flex; flex-direction:column; gap:6px; }
  .list-day-label{ font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--navy); margin-bottom:2px; }
  .list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; cursor:pointer;
  }
  .list-item:hover{ border-color:#B7AF9C; }
  .list-item-left{ display:flex; gap:10px; align-items:baseline; }
  .list-time{ font-family:'Fraunces',serif; font-weight:600; font-size:14px; min-width:48px; }
  .list-meta{ font-size:12px; color:var(--ink-soft); }
  .pill{ font-size:11px; padding:2px 9px; border-radius:20px; font-weight:500; white-space:nowrap; }
  .pill.blue{ background:var(--blue-tag-bg); color:var(--blue-tag); }
  .pill.green{ background:var(--green-tag-bg); color:var(--green-tag); }
  .pill.amber{ background:var(--amber-bg); color:var(--amber); }
  .pill.grey{ background:var(--paper-dim); color:var(--ink-soft); }
  .pill.red{ background:var(--red-bg); color:var(--red); }
  .empty{ padding:20px 4px; color:var(--ink-soft); font-size:13.5px; }

  .modal{
    position:fixed; inset:0; background:rgba(20,33,61,.4); z-index:50;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .modal.show{ opacity:1; pointer-events:auto; }
  .modal-box{ background:#fff; border-radius:10px; padding:22px; width:400px; max-width:92vw; max-height:88vh; overflow-y:auto; }
  .modal-box h3{ font-size:16px; margin-bottom:14px; }
  .field-row{ margin-bottom:14px; }
  .field-row label{ display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:4px; }
  .field-row input, .field-row select, .field-row textarea{ width:100%; }
  .field-row-2{ display:flex; gap:8px; }
  .field-row-2 > div{ flex:1; }
  .detail-line{ font-size:13px; margin-bottom:8px; }
  .detail-line b{ color:var(--ink-soft); font-weight:500; font-size:11.5px; display:block; margin-bottom:2px; }

  .test-panel{
    margin:14px 28px 0; padding:10px 14px; background:var(--paper-dim);
    border:1px dashed #C9C2B2; border-radius:8px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  }
  .test-panel .label{ font-size:12px; color:var(--ink-soft); margin-right:2px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:8px; font-size:13.5px;
    box-shadow:0 6px 18px rgba(0,0,0,.18); opacity:0; pointer-events:none;
    transition:opacity .25s ease, transform .25s ease; max-width:420px; z-index:60;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  @media (max-width:720px){
    .topbar{ padding:16px; }
    .controls-row{ padding:14px 16px 0; }
    .cal-wrap, .list-view{ margin:14px 16px 50px; }
    .test-panel{ margin:14px 16px 0; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div style="display:flex; gap:12px; align-items:flex-start;">
      <img src="assets/logo-small.png" alt="Legal Way Group" style="width:38px; height:38px; border-radius:50%; margin-top:2px;">
      <div>
        <h1>Agenda</h1>
        <p>Reuniões e compromissos — alimentada pelo Funil Comercial e pelo SDR, mais o que você agendar aqui direto.</p>
      </div>
    </div>
    <button class="primary" id="btn-nova-reuniao">+ Agendar Reunião</button>
  </div>
  <div class="tabs">
    <div class="tab active" data-agenda="Todos">Todos</div>
    <div class="tab" data-agenda="Renato">Renato</div>
    <div class="tab" data-agenda="Adriano">Adriano</div>
  </div>
</div>

<div class="controls-row">
  <div class="date-nav">
    <button class="icon ghost" id="nav-prev">←</button>
    <div class="current-date" id="current-date-label">—</div>
    <button class="icon ghost" id="nav-next">→</button>
    <button id="nav-hoje">Hoje</button>
  </div>
  <div class="view-toggle">
    <div class="tab active" data-view="dia">Dia</div>
    <div class="tab" data-view="lista">Lista (14 dias)</div>
  </div>
</div>

<div class="test-panel">
  <span class="label">Testes:</span>
  <button id="sim-evento">+ Compromisso de teste</button>
  <button class="ghost" id="reset-data">Limpar dados de teste</button>
</div>

<div id="cal-container"></div>

<div class="modal" id="modal-evento">
  <div class="modal-box">
    <h3 id="ev-titulo">Agendar Reunião</h3>
    <div class="field-row"><label>Cliente</label><input type="text" id="ev-cliente" placeholder="Nome do cliente"></div>
    <div class="field-row"><label>Telefone (opcional)</label><input type="text" id="ev-telefone" placeholder="+1 407 555 0000"></div>
    <div class="field-row"><label>Vendedor</label>
      <select id="ev-vendedor"><option>Renato</option><option>Adriano</option></select>
    </div>
    <div class="field-row-2">
      <div><label>Data</label><input type="date" id="ev-data"></div>
      <div><label>Horário (Flórida)</label><input type="time" id="ev-hora"></div>
    </div>
    <div class="field-row-2">
      <div><label>Duração</label>
        <select id="ev-duracao"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">1h</option></select>
      </div>
      <div><label>Tipo</label>
        <select id="ev-tipo">
          <option>Ligação</option><option>WhatsApp</option><option>Videochamada</option>
          <option>Google Meet</option><option>Zoom</option><option>Presencial</option><option>Outro</option>
        </select>
      </div>
    </div>
    <div class="field-row"><label>Local / link (opcional)</label><input type="text" id="ev-local" placeholder="Ex: link do Meet, endereço"></div>
    <div class="field-row"><label>Observação</label><textarea id="ev-obs" rows="2"></textarea></div>
    <div id="ev-conflito"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;">
      <button class="ghost" id="cancel-ev">Cancelar</button>
      <button class="primary" id="confirm-ev">Salvar</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-detalhe">
  <div class="modal-box">
    <h3 id="dt-titulo">Compromisso</h3>
    <div id="dt-corpo"></div>
    <div class="field-row"><label>Status</label>
      <select id="dt-status">
        <option>Agendada</option><option>Confirmada</option><option>Realizada</option>
        <option>Cancelada</option><option>Reagendada</option><option>No-show</option>
      </select>
    </div>
    <div class="field-row"><label>Resultado (pós-reunião)</label>
      <select id="dt-resultado">
        <option value="">—</option>
        <option>Interessado</option><option>Enviar proposta</option><option>Em análise</option>
        <option>Follow-up</option><option>Não qualificado</option><option>Sem interesse</option><option>No-show</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;justify-content:space-between;">
      <button class="danger" id="dt-excluir">Excluir</button>
      <div style="display:flex;gap:8px;">
        <button class="ghost" id="cancel-dt">Fechar</button>
        <button class="primary" id="confirm-dt">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const AGENDA_KEY = 'legalway-agenda-v1';
let agenda = [];
let filtroVendedor = 'Todos';
let viewMode = 'dia';
let currentDate = new Date();
let editingId = null;

const CAL_HORA_INICIO = 7;
const CAL_HORA_FIM = 21;
const CAL_PX_POR_HORA = 56;

function uid(){ return 'ag' + Date.now() + Math.floor(Math.random()*1000); }
function dateStr(d){ return d.toISOString().slice(0,10); }
function fmtDataLabel(d){
  return d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
}
function fmtDataCurta(iso){ return iso.split('-').reverse().join('/'); }

async function loadAgenda(){
  try{
    const res = await window.storage.get(AGENDA_KEY, true);
    agenda = res && res.value ? JSON.parse(res.value) : seedAgenda();
  }catch(e){ agenda = seedAgenda(); }
  // normaliza registros antigos (criados pelo SDR sem todos os campos)
  agenda.forEach(a=>{
    if(!a.status) a.status = 'Agendada';
    if(!a.tipo) a.tipo = 'Ligação';
    if(a.duracaoMin === undefined) a.duracaoMin = 30;
    if(a.resultado === undefined) a.resultado = null;
  });
  await saveAgenda();
  render();
}
async function saveAgenda(){
  try{ await window.storage.set(AGENDA_KEY, JSON.stringify(agenda), true); }
  catch(e){ console.error('Falha ao salvar agenda', e); }
}
function seedAgenda(){
  const hoje = dateStr(new Date());
  return [
    { id:'ag1', cliente:'Maria Silva', vendedor:'Renato', data:hoje, hora:'14:00', tipo:'Videochamada', duracaoMin:30, status:'Agendada', resultado:null, origem:'Funil comercial' },
    { id:'ag2', cliente:'João Pereira', vendedor:'Adriano', data:hoje, hora:'10:30', tipo:'Ligação', duracaoMin:30, status:'Confirmada', resultado:null, origem:'Funil comercial' }
  ];
}

function visiveis(){
  if(filtroVendedor === 'Todos') return agenda;
  return agenda.filter(a => a.vendedor === filtroVendedor);
}

function render(){
  document.getElementById('current-date-label').textContent =
    viewMode === 'dia' ? fmtDataLabel(currentDate) : `${fmtDataLabel(currentDate)} + 13 dias`;

  const container = document.getElementById('cal-container');
  if(viewMode === 'dia'){
    container.innerHTML = `<div class="cal-wrap" id="cal-wrap"></div>`;
    document.getElementById('cal-wrap').innerHTML = renderDiaCalendario(dateStr(currentDate));
    wireEventClicks();
  } else {
    container.innerHTML = `<div class="list-view" id="list-view"></div>`;
    document.getElementById('list-view').innerHTML = renderListaView();
    wireEventClicks();
  }
}

function renderDiaCalendario(dataIso){
  const doDia = visiveis().filter(a => a.data === dataIso);
  const horas = [];
  for(let h = CAL_HORA_INICIO; h < CAL_HORA_FIM; h++) horas.push(h);

  const linhas = horas.map(h=>{
    const label = h === 12 ? '12h' : (h > 12 ? (h-12)+'h' : h+'h');
    return `<div class="cal-hour-row"><div class="cal-hour-label">${label}</div><div class="cal-hour-track"></div></div>`;
  }).join('');

  const eventosPorHora = {};
  doDia.forEach(a=>{
    const h = parseInt(a.hora.split(':')[0]);
    if(h < CAL_HORA_INICIO || h >= CAL_HORA_FIM) return;
    (eventosPorHora[h] = eventosPorHora[h] || []).push(a);
  });

  // injeta os eventos dentro da track de cada hora (via segunda passada, mais simples que posicionamento absoluto)
  const linhasComEventos = horas.map(h=>{
    const label = h === 12 ? '12h' : (h > 12 ? (h-12)+'h' : h+'h');
    const evs = (eventosPorHora[h]||[]).sort((a,b)=>a.hora.localeCompare(b.hora));
    const evsHtml = evs.map(a => renderEventoBloco(a)).join('');
    return `<div class="cal-hour-row"><div class="cal-hour-label">${label}</div><div class="cal-hour-track">${evsHtml}</div></div>`;
  }).join('');

  return linhasComEventos || `<div class="empty">Sem horários configurados.</div>`;
}

function renderEventoBloco(a){
  const vendClass = a.vendedor === 'Adriano' ? 'vendedor-adriano' : '';
  const statusClass = a.status === 'Realizada' ? 'status-realizada' : (a.status === 'Cancelada' ? 'status-cancelada' : '');
  return `<div class="cal-event ${vendClass} ${statusClass}" data-open="${a.id}">
    <span class="ev-time">${a.hora}</span> · ${a.cliente} <span style="opacity:.75;">— ${a.vendedor} · ${a.tipo}</span>
  </div>`;
}

function renderListaView(){
  const inicio = new Date(currentDate);
  const dias = [];
  for(let i=0;i<14;i++){
    const d = new Date(inicio); d.setDate(d.getDate()+i);
    dias.push(dateStr(d));
  }
  const lista = visiveis().filter(a => dias.includes(a.data));
  if(lista.length === 0) return `<div class="empty">Nenhum compromisso nos próximos 14 dias.</div>`;

  return dias.map(dia=>{
    const doDia = lista.filter(a=>a.data===dia).sort((a,b)=>a.hora.localeCompare(b.hora));
    if(doDia.length === 0) return '';
    return `
      <div class="list-day">
        <div class="list-day-label">${new Date(dia+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'2-digit'})}</div>
        ${doDia.map(a => `
          <div class="list-item" data-open="${a.id}">
            <div class="list-item-left">
              <div class="list-time">${a.hora}</div>
              <div>
                <div style="font-weight:500;">${a.cliente}</div>
                <div class="list-meta">${a.vendedor} · ${a.tipo} · ${a.duracaoMin}min${a.origem ? ' · ' + a.origem : ''}</div>
              </div>
            </div>
            ${statusPill(a.status)}
          </div>
        `).join('')}
      </div>`;
  }).join('');
}

function statusPill(status){
  const map = {
    'Agendada': 'grey', 'Confirmada': 'blue', 'Realizada': 'green',
    'Cancelada': 'red', 'Reagendada': 'amber', 'No-show': 'red'
  };
  return `<span class="pill ${map[status]||'grey'}">${status}</span>`;
}

function wireEventClicks(){
  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalhe(el.getAttribute('data-open')));
  });
}

// ---- Navegação ----
document.querySelectorAll('.tab[data-agenda]').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab[data-agenda]').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    filtroVendedor = t.getAttribute('data-agenda');
    render();
  });
});
document.querySelectorAll('.tab[data-view]').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab[data-view]').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    viewMode = t.getAttribute('data-view');
    render();
  });
});
document.getElementById('nav-prev').addEventListener('click', ()=>{
  currentDate.setDate(currentDate.getDate() - (viewMode==='dia'?1:14));
  render();
});
document.getElementById('nav-next').addEventListener('click', ()=>{
  currentDate.setDate(currentDate.getDate() + (viewMode==='dia'?1:14));
  render();
});
document.getElementById('nav-hoje').addEventListener('click', ()=>{
  currentDate = new Date();
  render();
});

// ---- Criar novo compromisso ----
document.getElementById('btn-nova-reuniao').addEventListener('click', ()=>{
  document.getElementById('ev-titulo').textContent = 'Agendar Reunião';
  ['ev-cliente','ev-telefone','ev-local','ev-obs'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('ev-vendedor').value = filtroVendedor !== 'Todos' ? filtroVendedor : 'Renato';
  document.getElementById('ev-data').value = dateStr(currentDate);
  document.getElementById('ev-hora').value = '';
  document.getElementById('ev-duracao').value = '30';
  document.getElementById('ev-tipo').value = 'Ligação';
  document.getElementById('ev-conflito').innerHTML = '';
  document.getElementById('modal-evento').classList.add('show');
});
document.getElementById('cancel-ev').addEventListener('click', ()=> document.getElementById('modal-evento').classList.remove('show'));

['ev-vendedor','ev-data','ev-hora'].forEach(id=>{
  document.getElementById(id).addEventListener('input', checarConflitoNovo);
  document.getElementById(id).addEventListener('change', checarConflitoNovo);
});
function checarConflitoNovo(){
  const vendedor = document.getElementById('ev-vendedor').value;
  const data = document.getElementById('ev-data').value;
  const hora = document.getElementById('ev-hora').value;
  const el = document.getElementById('ev-conflito');
  if(!(vendedor && data && hora)){ el.innerHTML=''; return; }
  const conflito = agenda.find(a => a.vendedor===vendedor && a.data===data && a.status!=='Cancelada' && Math.abs(minutosEntre(a.hora, hora)) < 30);
  el.innerHTML = conflito
    ? `<div class="field-row" style="color:var(--red); background:var(--red-bg); padding:8px 10px; border-radius:6px;">ATENÇÃO — CONFLITO DE HORÁRIO: ${vendedor} já tem ${conflito.cliente} às ${conflito.hora}.</div>`
    : '';
}
function minutosEntre(h1, h2){
  const [a,b] = h1.split(':').map(Number);
  const [c,d] = h2.split(':').map(Number);
  return (a*60+b) - (c*60+d);
}

document.getElementById('confirm-ev').addEventListener('click', ()=>{
  const cliente = document.getElementById('ev-cliente').value.trim();
  const data = document.getElementById('ev-data').value;
  const hora = document.getElementById('ev-hora').value;
  if(!cliente){ toast('Preencha o nome do cliente.'); return; }
  if(!data || !hora){ toast('Escolha data e horário.'); return; }

  agenda.push({
    id: uid(),
    cliente,
    telefone: document.getElementById('ev-telefone').value.trim(),
    vendedor: document.getElementById('ev-vendedor').value,
    data, hora,
    duracaoMin: Number(document.getElementById('ev-duracao').value),
    tipo: document.getElementById('ev-tipo').value,
    local: document.getElementById('ev-local').value.trim(),
    observacao: document.getElementById('ev-obs').value.trim(),
    status: 'Agendada', resultado: null,
    origem: 'Agendado direto na Agenda'
  });
  saveAgenda(); render();
  document.getElementById('modal-evento').classList.remove('show');
  toast(`Reunião agendada com ${cliente}.`);
});

// ---- Detalhe / edição ----
function abrirDetalhe(id){
  editingId = id;
  const a = agenda.find(x=>x.id===id);
  document.getElementById('dt-titulo').textContent = a.cliente;
  document.getElementById('dt-corpo').innerHTML = `
    <div class="detail-line"><b>Quando</b>${fmtDataCurta(a.data)} às ${a.hora} (Flórida) · ${a.duracaoMin} min</div>
    <div class="detail-line"><b>Vendedor</b>${a.vendedor}</div>
    <div class="detail-line"><b>Tipo</b>${a.tipo}${a.local ? ' · ' + a.local : ''}</div>
    ${a.telefone ? `<div class="detail-line"><b>Telefone</b>${a.telefone}</div>` : ''}
    ${a.estadoCliente ? `<div class="detail-line"><b>Cliente em</b>${a.estadoCliente}${a.horaCliente ? ' · ' + a.horaCliente + ' no fuso dele' : ''}</div>` : ''}
    ${a.observacao ? `<div class="detail-line"><b>Observação</b>${a.observacao}</div>` : ''}
    <div class="detail-line"><b>Origem</b>${a.origem || '—'}</div>
  `;
  document.getElementById('dt-status').value = a.status || 'Agendada';
  document.getElementById('dt-resultado').value = a.resultado || '';
  document.getElementById('modal-detalhe').classList.add('show');
}
document.getElementById('cancel-dt').addEventListener('click', ()=> document.getElementById('modal-detalhe').classList.remove('show'));
document.getElementById('confirm-dt').addEventListener('click', ()=>{
  const a = agenda.find(x=>x.id===editingId);
  a.status = document.getElementById('dt-status').value;
  a.resultado = document.getElementById('dt-resultado').value || null;
  saveAgenda(); render();
  document.getElementById('modal-detalhe').classList.remove('show');
  toast('Compromisso atualizado.');
});
document.getElementById('dt-excluir').addEventListener('click', ()=>{
  agenda = agenda.filter(x=>x.id!==editingId);
  saveAgenda(); render();
  document.getElementById('modal-detalhe').classList.remove('show');
  toast('Compromisso excluído.');
});

// ---- Testes ----
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._t);
  window._t = setTimeout(()=> el.classList.remove('show'), 3400);
}
const nomesTeste = ['Renata Alves','Diego Martins','Patrícia Gomes','Bruno Ferreira'];
document.getElementById('sim-evento').addEventListener('click', ()=>{
  const nome = nomesTeste[Math.floor(Math.random()*nomesTeste.length)];
  const vendedor = Math.random() > 0.5 ? 'Renato' : 'Adriano';
  const hora = `${String(8 + Math.floor(Math.random()*11)).padStart(2,'0')}:${Math.random()>0.5?'00':'30'}`;
  agenda.push({
    id: uid(), cliente: nome, vendedor, data: dateStr(currentDate), hora,
    duracaoMin: 30, tipo:'Ligação', status:'Agendada', resultado:null, origem:'Teste'
  });
  saveAgenda(); render();
  toast(`Compromisso de teste criado: ${nome} com ${vendedor} às ${hora}`);
});
document.getElementById('reset-data').addEventListener('click', async ()=>{
  agenda = seedAgenda();
  await saveAgenda();
  render();
  toast('Dados de teste reiniciados.');
});

loadAgenda();
</script>
</body>
